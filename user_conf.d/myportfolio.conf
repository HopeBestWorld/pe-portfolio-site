# 1. Define rate limit zone (1 request per minute per IP address)
limit_req_zone $binary_remote_addr zone=timeline_limit:10m rate=1m;

server {
    listen 80;
    server_name hope-pe-portfolio.duckdns.org;

    if ($host = hope-pe-portfolio.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hope-pe-portfolio.duckdns.org;

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    # 2. Apply rate limit specifically to POST requests on /api/timeline_post
    location = /api/timeline_post {
        limit_req zone=timeline_limit;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }

    # Load the certificate files
    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
}